services:
  - type: web
    name: crunchyroll-anime-info
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CR_LOCALE
        value: en-US
      - key: CACHE_TTL_SECONDS
        value: "2700"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
